# Retrace itself: the investigator, its web page and its own database.
# What it investigates is set in the .env file (see .env.example).
services:
  db:
    image: postgres:17
    environment:
      # Local credentials only; nothing here is reachable from outside Docker.
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: payments
    volumes:
      # Postgres runs these files in name order, once, when the database is first created.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: only counts as ready after the setup files above have run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d payments"]
      interval: 2s
      timeout: 2s
      retries: 15

  investigator:
    build: .
    command: uvicorn investigator.main:app --host 0.0.0.0 --port 8002 --reload
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/investigator
      TELEMETRY_DATABASE_URL: postgresql://investigator_ro:investigator_ro@db:5432/telemetry
      TELEMETRY_INGEST_DATABASE_URL: postgresql://app:app@db:5432/telemetry
      # A model served in the OpenAI format. Left unset, it is Ollama on the host machine.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-7b-8k}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_KEY_HEADER: ${LLM_API_KEY_HEADER:-}
      LLM_PRICE_INPUT_PER_MILLION: ${LLM_PRICE_INPUT_PER_MILLION:-}
      LLM_PRICE_OUTPUT_PER_MILLION: ${LLM_PRICE_OUTPUT_PER_MILLION:-}
      AGENT_TRACES_ENDPOINT: ${AGENT_TRACES_ENDPOINT:-}
      # The system to investigate. Each one left unset is simply not used.
      TARGET_DATABASE_URL: ${TARGET_DATABASE_URL:-}
      CONFIG_SOURCES: ${CONFIG_SOURCES:-}
      TARGET_API_URL: ${TARGET_API_URL:-}
      REPRODUCTION_NEEDS_APPROVAL: ${REPRODUCTION_NEEDS_APPROVAL:-}
      TARGET_REPO_DIR: ${TARGET_REPO:+/repo}
      TARGET_REPO_PATHS: ${TARGET_REPO_PATHS:-}
      TARGET_REPO_BASELINE: ${TARGET_REPO_BASELINE:-}
    volumes:
      - ./investigator:/app/investigator
      # The target system's code. With TARGET_REPO unset, this folder is mounted but not used.
      - ${TARGET_REPO:-./investigator}:/repo:ro
    extra_hosts:
      # Lets addresses in .env reach programs running on this machine, on Linux too.
      - host.docker.internal:host-gateway
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  viewer:
    # The web page for reading investigations: http://localhost:5173
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      INVESTIGATOR_URL: http://investigator:8002
    ports:
      - "5173:5173"
    volumes:
      - ./viewer:/app
      # The container keeps its own installed packages, built for Linux.
      - /app/node_modules
    depends_on:
      - investigator
