services:
  db:
    image: postgres:17
    environment:
      # Local test-bed credentials only; nothing here is reachable from outside Docker.
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: payments
    volumes:
      # Postgres runs these files in name order, once, when the database is first created.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: only counts as ready after the setup files above have run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d payments"]
      interval: 2s
      timeout: 2s
      retries: 15

  provider-mock:
    build: .
    command: uvicorn services.provider_mock.main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      TELEMETRY_DATABASE_URL: postgresql://app:app@db:5432/telemetry
    volumes:
      - ./services:/app/services
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  payment-api:
    build: .
    command: uvicorn services.payment_api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/payments
      TELEMETRY_DATABASE_URL: postgresql://app:app@db:5432/telemetry
      PROVIDER_URL: http://provider-mock:8001
    volumes:
      - ./services:/app/services
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      provider-mock:
        condition: service_started

  investigator:
    build: .
    command: uvicorn investigator.main:app --host 0.0.0.0 --port 8002 --reload
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/investigator
      TELEMETRY_DATABASE_URL: postgresql://investigator_ro:investigator_ro@db:5432/telemetry
      TARGET_DATABASE_URL: postgresql://investigator_ro:investigator_ro@db:5432/payments
      CONFIG_SOURCES: '{"payment-api": "http://payment-api:8000/admin/flags"}'
      # A model served in the OpenAI format. This one is Ollama running on the host machine.
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: qwen2.5-7b-8k
      TARGET_REPO_DIR: /repo
      TARGET_REPO_PATHS: '["services/payment_api", "services/common", "db/01_payments.sql", "db/02_telemetry.sql"]'
    volumes:
      - ./investigator:/app/investigator
      - ./.git:/repo/.git:ro
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy

  dev:
    # A workbench for tests, lint and scenarios. Not started by `docker compose up`.
    profiles: ["dev"]
    build: .
    environment:
      PAYMENT_API_URL: http://payment-api:8000
      PROVIDER_URL: http://provider-mock:8001
      INVESTIGATOR_URL: http://investigator:8002
      INVESTIGATOR_DATABASE_URL: postgresql://app:app@db:5432/investigator
      DATABASE_URL: postgresql://app:app@db:5432/payments
      TELEMETRY_DATABASE_URL: postgresql://investigator_ro:investigator_ro@db:5432/telemetry
      TARGET_DATABASE_URL: postgresql://investigator_ro:investigator_ro@db:5432/payments
      TARGET_REPO_DIR: /repo
      TARGET_REPO_PATHS: '["services/payment_api", "services/common", "db/01_payments.sql", "db/02_telemetry.sql"]'
    volumes:
      - ./services:/app/services
      - ./investigator:/app/investigator
      - ./scenarios:/app/scenarios
      - ./tests:/app/tests
      - ./db:/app/db:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./.git:/repo/.git:ro
    depends_on:
      payment-api:
        condition: service_started
      investigator:
        condition: service_started
